name: elecrohr-local

services:
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    networks: [local]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 15s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen3:4b}
    entrypoint: ["/bin/sh", "-c"]
    command: 'ollama show "$$LLM_MODEL" >/dev/null 2>&1 || ollama pull "$$LLM_MODEL"'
    networks: [local]
    restart: "no"

  model-init:
    build:
      context: .
      dockerfile: Dockerfile.local
    command: ["python", "-m", "local_voice.prepare_models"]
    volumes:
      - model_data:/models
    environment:
      HF_HOME: /models/huggingface
      TORCH_HOME: /models/torch
    networks: [local]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      model-init:
        condition: service_completed_successfully
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen3:4b}
      WHISPER_PATH: /models/whisper/small
      TTS_PATH: /models/tts/v5_6_ru.pt
      TTS_SPEAKER: ${LOCAL_TTS_SPEAKER:-xenia}
      KNOWLEDGE_DIR: /srv/knowledge
      DATA_DIR: /data/local_voice
      HF_HOME: /models/huggingface
      TORCH_HOME: /models/torch
      HF_HUB_OFFLINE: "1"
    volumes:
      - model_data:/models:ro
      - interview_data:/data
    ports:
      - "127.0.0.1:8000:8000"
    networks: [local]
    shm_size: "512mb"
    restart: unless-stopped

networks:
  local:

volumes:
  ollama_data:
  model_data:
  interview_data:
