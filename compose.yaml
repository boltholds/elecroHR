name: elecrohr-local

services:
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    networks: [local]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 15s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen3:4b}
    entrypoint: ["/bin/sh", "-c"]
    command: ['ollama show "$$LLM_MODEL" >/dev/null 2>&1 || ollama pull "$$LLM_MODEL"']
    networks: [local]
    restart: "no"

  tts-model-init:
    build:
      context: .
      dockerfile: Dockerfile.tts
    command: ["python", "-m", "tts_service.prepare_models"]
    environment:
      HF_HOME: /models/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_DOWNLOAD_TIMEOUT: "${HF_HUB_DOWNLOAD_TIMEOUT:-120}"
      HF_HUB_ETAG_TIMEOUT: "${HF_HUB_ETAG_TIMEOUT:-45}"
      HF_HUB_DISABLE_XET: "${HF_HUB_DISABLE_XET:-0}"
    volumes:
      - tts_models:/models/huggingface
    networks: [local]
    restart: "no"

  tts:
    build:
      context: .
      dockerfile: Dockerfile.tts
    depends_on:
      tts-model-init:
        condition: service_completed_successfully
    environment:
      HF_HOME: /models/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - tts_models:/models/huggingface:ro
    networks: [local]
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/health/ready', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 240s

  model-init:
    build:
      context: .
      dockerfile: Dockerfile.local
    command: ["python", "-m", "local_voice.prepare_models"]
    volumes:
      - model_data:/models
    environment:
      HF_HOME: /models/huggingface
      TORCH_HOME: /models/torch
    networks: [local]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      model-init:
        condition: service_completed_successfully
      tts:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen3:4b}
      WHISPER_PATH: /models/whisper/small
      TTS_BASE_URL: http://tts:8011
      KNOWLEDGE_DIR: /srv/knowledge
      DATA_DIR: /data/local_voice
      HF_HOME: /models/huggingface
      TORCH_HOME: /models/torch
      HF_HUB_OFFLINE: "1"
    volumes:
      - model_data:/models:ro
      - interview_data:/data
    ports:
      - "127.0.0.1:8000:8000"
    networks: [local]
    shm_size: "512mb"
    restart: unless-stopped

networks:
  local:

volumes:
  ollama_data:
  model_data:
  tts_models:
  interview_data:
